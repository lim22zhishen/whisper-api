[project]
name = "whisper-api"
version = "0.1.0"
description = "Self-hosted speech-to-text API (faster-whisper)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # faster-whisper 1.2.1 calls av.open(metadata_errors=...), which av 19 rejects.
    "av>=11,<17",
    "faster-whisper>=1.1,<2",
    "fastapi>=0.115",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.18",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# NVIDIA libraries the GPU build of the speech engine loads at run time.
gpu = [
    # 12.9 has no Windows build.
    "nvidia-cublas-cu12>=12.4,<12.9",
    "nvidia-cudnn-cu12>=9,<10",
]

[project.scripts]
whisper-api = "whisper_api.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whisper_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
